<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TrackLink</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:var(--tg-theme-bg-color,#fff);--fg:var(--tg-theme-text-color,#14161a);
  --hint:var(--tg-theme-hint-color,#8a919c);--accent:var(--tg-theme-button-color,#3b82f6);
  --accent-fg:var(--tg-theme-button-text-color,#fff);
  --line:color-mix(in srgb,var(--fg) 9%,transparent);--ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{-webkit-font-smoothing:antialiased;overscroll-behavior:contain;touch-action:manipulation;margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif;padding:32px 22px calc(40px + env(safe-area-inset-bottom,0px))}
.total{font-size:64px;font-weight:300;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.cap{color:var(--hint);margin:6px 0 12px}
.plan{display:flex;align-items:center;gap:12px;color:var(--hint);font-size:14px;margin-bottom:28px;min-height:20px}
.plan button{border:0;background:none;padding:0;color:var(--accent);font:inherit;font-weight:500;cursor:pointer}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .35s var(--ease)}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-radius:22px 22px 0 0;padding:26px 22px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .5s var(--ease)}
.open-sheet .scrim{opacity:1;pointer-events:auto}.open-sheet .sheet{transform:none}
.sheet h2{margin:0 0 6px;font-size:22px;font-weight:600;letter-spacing:-.02em}
.sheet p{margin:0 0 22px;color:var(--hint)}
.wide{width:100%;padding:14px}
.ghostb{border:0;background:none;color:var(--hint);font:inherit;width:100%;padding:14px 0 0;cursor:pointer}
form{display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:6px;transition:border-color .3s}
form:focus-within{border-color:var(--accent)}
#u{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:inherit;font-size:16px;padding:10px 0;outline:0}
#u::placeholder{color:var(--hint)}
.add{border:0;border-radius:999px;background:var(--accent);color:var(--accent-fg);padding:9px 18px;font:inherit;font-weight:600;transition:transform .2s var(--ease),opacity .2s}
.add:active{transform:scale(.96)}.add:disabled{opacity:.5}
.err{color:#e5484d;font-size:14px;margin-top:10px}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.stagger .item{animation:rise .55s var(--ease) backwards;animation-delay:calc(var(--i) * 45ms)}
.sk{height:63px;border-bottom:1px solid var(--line);position:relative;overflow:hidden}
.sk::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--fg) 6%,transparent),transparent);transform:translateX(-100%);animation:shim 1.4s infinite}
@keyframes shim{to{transform:translateX(100%)}}
.spark{width:56px;height:20px;flex:none}
.head{transition:opacity .2s}.head:active{opacity:.6}
.inner{contain:layout paint}
.lite *{animation:none!important}
.item{display:grid;grid-template-rows:1fr;transition:grid-template-rows .45s var(--ease),opacity .35s}
.item.gone{grid-template-rows:0fr;opacity:0}
.inner{overflow:hidden;min-height:0;border-bottom:1px solid var(--line)}
.head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0;cursor:pointer;user-select:none}
.head:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.t{min-width:0;display:flex;flex-direction:column;flex:1}
.name{font-size:17px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--hint);font-size:13px}
.n{font-size:26px;font-weight:300;letter-spacing:-.02em;font-variant-numeric:tabular-nums;transition:color .3s}
.item.open .n{color:var(--accent)}
.rn{font:inherit;font-size:17px;font-weight:600;border:0;border-bottom:1px solid var(--accent);background:transparent;color:var(--fg);outline:0;width:100%;padding:0;user-select:text}
.more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease)}
.item.open .more{grid-template-rows:1fr}
.more>div{overflow:hidden;min-height:0}
.pad{padding:2px 0 22px}
.bars{display:flex;align-items:flex-end;gap:8px;height:64px}
.bar{flex:1;height:100%;display:flex;align-items:flex-end}
.bar i{display:block;width:100%;border-radius:4px;background:color-mix(in srgb,var(--fg) 14%,transparent);transform:scaleY(0);transform-origin:bottom;transition:transform .6s var(--ease)}
.bar.today i{background:var(--accent)}
.shown .bar i{transform:scaleY(1)}
.days{display:flex;gap:8px;margin:8px 0 20px;color:var(--hint);font-size:12px}
.days span{flex:1;text-align:center}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:20px}
.cols h3{margin:0 0 8px;font-size:13px;font-weight:500;color:var(--hint)}
.r{display:flex;justify-content:space-between;padding:3px 0;font-variant-numeric:tabular-nums}
.acts{display:flex;gap:10px 18px;flex-wrap:wrap}
.seg{display:flex;gap:18px;margin-bottom:14px}
.seg button{border:0;background:none;padding:0;color:var(--hint);font:inherit;font-size:13px;cursor:pointer;transition:color .25s}
.seg .on{color:var(--fg);font-weight:600}
.acts button{border:0;background:none;padding:0;cursor:pointer;color:var(--accent);font:inherit;font-size:14px;font-weight:500;transition:opacity .2s}
.acts button:active{opacity:.5}
.acts .del{color:#e5484d;margin-left:auto}
.empty{color:var(--hint);padding:56px 0;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation:none!important}}
</style>
</head>
<body>
<div class="total" id="total">0</div>
<div class="cap">всего кликов</div>
<div class="plan" id="plan"></div>
<form id="f"><input id="u" placeholder="Вставьте ссылку" inputmode="url" autocomplete="off" required><button class="add" id="b">Создать</button></form>
<div id="err" class="err" hidden></div>
<div id="list" class="list"></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><h2>TrackLink Pro</h2><p id="sp"></p><button class="add wide" id="pay"></button><button class="ghostb" id="later">Не сейчас</button></div>
<script>
const tg = Telegram.WebApp; tg.ready(); tg.expand();
const $ = (id) => document.getElementById(id);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const hap = (k) => { try { tg.HapticFeedback.impactOccurred(k || "light"); } catch {} };
const lite = (navigator.hardwareConcurrency || 8) <= 4 || (navigator.deviceMemory || 8) <= 2; // слабые телефоны: меньше анимаций
if (lite) document.documentElement.classList.add("lite");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches || lite;
const NS = "http://www.w3.org/2000/svg";
function spark(v) {
  const s = document.createElementNS(NS, "svg"), p = document.createElementNS(NS, "polyline"), max = Math.max(1, ...v), flat = !v.some(Boolean);
  s.setAttribute("viewBox", "0 0 56 20"); s.setAttribute("class", "spark");
  p.setAttribute("points", v.map((x, i) => `${(i * 56 / 6).toFixed(1)},${(18 - (x / max) * 16).toFixed(1)}`).join(" "));
  p.setAttribute("fill", "none"); p.setAttribute("stroke", flat ? "var(--hint)" : "var(--accent)"); p.setAttribute("stroke-opacity", flat ? ".4" : "1");
  p.setAttribute("stroke-width", "1.6"); p.setAttribute("stroke-linecap", "round"); p.setAttribute("stroke-linejoin", "round");
  s.append(p); return s;
}
const call = async (path, opt = {}) => {
  const r = await fetch("/api" + path, { ...opt, headers: { authorization: "tma " + tg.initData, "content-type": "application/json" } });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(d.error || (r.status === 401 ? "Откройте приложение из Telegram." : "Ошибка, попробуйте ещё раз")); e.limit = !!d.limit; throw e; }
  return d;
};
const host = (u) => { try { return new URL(u).host.replace(/^www\./, ""); } catch { return u; } };
const flag = (c) => /^[A-Z]{2}$/.test(c) ? String.fromCodePoint(...[...c].map((x) => 127397 + x.charCodeAt())) : "🌐";
const fail = (m) => { $("err").textContent = m; $("err").hidden = false; };
const links = [], list = $("list");
let me = null;
const dt = (ms) => new Date(ms).toLocaleDateString("ru", { day: "numeric", month: "long" });
function renderPlan() {
  const p = $("plan"); p.replaceChildren(); if (!me) return;
  if (me.pro) { p.append(el("span", "", "Pro до " + dt(me.until))); return; }
  const b = el("button", "", "Подключить Pro"); b.onclick = openSheet;
  p.append(el("span", "", `Бесплатно: ${me.used} из ${me.limit}`), b);
}
const loadMe = () => call("/me").then((d) => { me = d; renderPlan(); }).catch(() => {});
function openSheet() {
  if (!me) return;
  $("sp").textContent = `${me.days} дней, до ${me.proLimit} ссылок. Продление добавляет дни к текущему сроку.`;
  $("pay").textContent = `Оплатить ${me.price} ⭐`; document.body.classList.add("open-sheet");
}
const closeSheet = () => document.body.classList.remove("open-sheet");
$("scrim").onclick = closeSheet; $("later").onclick = closeSheet;
$("pay").onclick = async () => {
  try {
    const { link } = await call("/invoice", { method: "POST" });
    tg.openInvoice(link, (s) => { if (s === "paid") { hap("medium"); closeSheet(); loadMe(); } });
  } catch (x) { fail(x.message); }
};
let shown = 0, raf;

function countTo(to) {
  cancelAnimationFrame(raf);
  const from = shown, t0 = performance.now();
  if (reduce) { shown = to; $("total").textContent = to.toLocaleString("ru"); return; }
  const step = (t) => {
    const p = Math.min(1, (t - t0) / 800), e = 1 - Math.pow(1 - p, 3);
    shown = Math.round(from + (to - from) * e); $("total").textContent = shown.toLocaleString("ru");
    if (p < 1) raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
}
const sync = () => countTo(links.reduce((s, l) => s + l.clicks, 0));
const showEmpty = () => list.replaceChildren(el("div", "empty", "Пока пусто. Вставьте ссылку выше и нажмите «Создать»."));

function pairs(title, rows, fmt) {
  const box = el("div"); box.append(el("h3", "", title));
  if (!rows.length) box.append(el("div", "r", "—"));
  rows.forEach((r) => { const d = el("div", "r"); d.append(el("span", "", fmt(r.k)), el("b", "", r.n)); box.append(d); });
  return box;
}

function row(l) {
  const item = el("section", "item"), inner = el("div", "inner");
  const head = el("div", "head"), t = el("span", "t"), name = el("span", "name");
  const n = el("span", "n", l.clicks.toLocaleString("ru"));
  head.tabIndex = 0; head.setAttribute("role", "button");
  const setName = () => { name.textContent = l.name || host(l.url); };
  setName(); t.append(name, el("span", "sub", "/s/" + l.code)); head.append(t, spark(l.spark || [0, 0, 0, 0, 0, 0, 0]), n);
  const more = el("div", "more"), mi = el("div"), pad = el("div", "pad");
  mi.append(pad); more.append(mi); inner.append(head, more); item.append(inner);

  const rename = () => {
    const inp = el("input", "rn"); inp.value = l.name || ""; inp.placeholder = host(l.url); inp.maxLength = 60;
    inp.onclick = (e) => e.stopPropagation();
    name.replaceWith(inp); inp.focus();
    let done = false;
    const finish = async (save) => {
      if (done) return; done = true;
      if (save) { const v = inp.value.trim();
        try { await call("/links/" + l.code, { method: "PATCH", body: JSON.stringify({ name: v }) }); l.name = v || null; } catch (x) { fail(x.message); } }
      inp.replaceWith(name); setName();
    };
    inp.onkeydown = (e) => { if (e.key === "Enter") finish(true); if (e.key === "Escape") finish(false); };
    inp.onblur = () => finish(true);
  };
  const doDel = async () => {
    try {
      await call("/links/" + l.code, { method: "DELETE" });
      hap("medium"); item.classList.add("gone"); links.splice(links.indexOf(l), 1); sync(); loadMe();
      setTimeout(() => { item.remove(); if (!links.length) showEmpty(); }, 480);
    } catch (x) { fail(x.message); }
  };
  const del = () => {
    const msg = "Удалить ссылку вместе со статистикой?";
    tg.showConfirm ? tg.showConfirm(msg, (ok) => ok && doDel()) : confirm(msg) && doDel();
  };

  let period = 7;
  const detail = async () => {
    const d = await call(`/links/${l.code}?days=${period}`);
    const map = Object.fromEntries(d.days.map((x) => [x.k, x.n]));
    const days = [...Array(period)].map((_, i) => new Date(Date.now() - (period - 1 - i) * 864e5));
    const vals = days.map((x) => map[x.toISOString().slice(0, 10)] || 0), max = Math.max(1, ...vals);
    const bars = el("div", "bars"), labels = el("div", "days");
    if (period > 7) bars.style.gap = "3px";
    vals.forEach((v, i) => {
      const b = el("div", "bar" + (i === period - 1 ? " today" : "")), bi = document.createElement("i");
      bi.style.height = Math.max(5, (v / max) * 100) + "%"; bi.style.transitionDelay = (lite ? 0 : Math.min(i * 45, 600)) + "ms"; bi.title = v;
      b.append(bi); bars.append(b);
      if (period === 7) labels.append(el("span", "", days[i].toLocaleDateString("ru", { weekday: "short" })));
    });
    if (period > 7) [0, Math.floor(period / 2), period - 1].forEach((i) => labels.append(el("span", "", days[i].toLocaleDateString("ru", { day: "numeric", month: "short" }))));
    const seg = el("div", "seg");
    [7, 30, 90].forEach((p) => {
      const b = el("button", p === period ? "on" : "", p + " дн.");
      b.onclick = () => { if (p === period) return; period = p; hap(); detail().catch((x) => fail(x.message)); };
      seg.append(b);
    });
    const cols = el("div", "cols");
    cols.append(pairs("Страны", d.countries, (k) => (k ? flag(k) + " " + k : "—")), pairs("Источники", d.sources, (k) => k || "без метки"));
    const acts = el("div", "acts"), copy = el("button", "", "Копировать"), ren = el("button", "", "Назвать"), exp = el("button", "", "Выгрузить"), rm = el("button", "del", "Удалить");
    copy.onclick = () => { navigator.clipboard.writeText(location.origin + "/s/" + l.code); hap(); copy.textContent = "Скопировано"; setTimeout(() => (copy.textContent = "Копировать"), 1600); };
    exp.onclick = async () => {
      exp.textContent = "Отправляю…";
      try { await call("/links/" + l.code + "/export", { method: "POST" }); exp.textContent = "Файл в чате с ботом"; hap(); }
      catch (x) { exp.textContent = "Выгрузить"; fail(x.message); }
      setTimeout(() => (exp.textContent = "Выгрузить"), 2500);
    };
    ren.onclick = rename; rm.onclick = del; acts.append(copy, ren, exp, rm);
    const nb = el("div"); nb.append(seg, bars, labels, cols, acts); pad.replaceChildren(nb);
    requestAnimationFrame(() => requestAnimationFrame(() => nb.classList.add("shown")));
  };
  let loaded = false;
  const toggle = () => {
    hap(); const open = item.classList.toggle("open"); head.setAttribute("aria-expanded", open);
    if (open && !loaded) { loaded = true; detail().catch((x) => { loaded = false; fail(x.message); }); }
  };
  head.onclick = toggle;
  head.onkeydown = (e) => { if (e.target === head && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); toggle(); } };
  return item;
}

$("f").onsubmit = async (e) => {
  e.preventDefault(); $("err").hidden = true;
  const v = $("u").value.trim(), url = /^https?:\/\//i.test(v) ? v : "https://" + v, b = $("b");
  b.disabled = true;
  try {
    const { code } = await call("/links", { method: "POST", body: JSON.stringify({ url }) });
    $("u").value = ""; hap("medium"); loadMe();
    const l = { code, url, name: null, clicks: 0 }; links.unshift(l);
    if (links.length === 1) list.replaceChildren();
    const r = row(l); r.classList.add("gone"); list.prepend(r);
    requestAnimationFrame(() => requestAnimationFrame(() => r.classList.remove("gone")));
  } catch (x) { fail(x.message); if (x.limit) openSheet(); }
  b.disabled = false;
};

list.replaceChildren(...[0, 1, 2].map(() => el("div", "sk")));
loadMe();
call("/links").then((d) => {
  links.push(...d);
  if (links.length) {
    const rows = links.map(row); rows.forEach((r, i) => r.style.setProperty("--i", Math.min(i, 8)));
    list.classList.add("stagger"); list.replaceChildren(...rows); setTimeout(() => list.classList.remove("stagger"), 1300);
  } else showEmpty();
  sync();
}).catch((x) => { list.replaceChildren(); fail(x.message); });
</script>
</body>
</html>
